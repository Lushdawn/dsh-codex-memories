name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['20', '22']

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      # The plugin has no runtime dependencies, so there is nothing to install.
      - name: Syntax check every module
        run: npm run check

      - name: Offline end-to-end smoke test
        run: npm test

      - name: Verify the published file list is complete
        run: npm pack --dry-run
